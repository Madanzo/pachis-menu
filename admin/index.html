<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pachis Admin - Customer Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-box h1 {
            margin-bottom: 10px;
            font-size: 1.8rem;
        }

        .login-box p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
        }

        .login-box input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        .login-box button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00cec9 0%, #00b894 100%);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 206, 201, 0.4);
        }

        .error-msg {
            color: #ff6b6b;
            margin-top: 15px;
            display: none;
        }

        /* Dashboard Styles */
        .dashboard {
            display: none;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .dashboard-header h1 {
            font-size: 1.8rem;
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px 30px;
            flex: 1;
            min-width: 150px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-card .number {
            font-size: 2rem;
            font-weight: 700;
            color: #00cec9;
        }

        .stat-card .label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .search-bar {
            margin-bottom: 20px;
        }

        .search-bar input {
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .table-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            background: rgba(0, 206, 201, 0.2);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background: rgba(0, 206, 201, 0.3);
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-logout {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-refresh {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00cec9 0%, #00b894 100%);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 768px) {

            th,
            td {
                padding: 10px;
                font-size: 0.85rem;
            }

            .table-container {
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginScreen">
        <div class="login-box">
            <h1>🌿 Pachis Admin</h1>
            <p>Enter admin password to access customer dashboard</p>
            <input type="password" id="passwordInput" placeholder="Admin Password"
                onkeypress="if(event.key === 'Enter') login()">
            <button onclick="login()">Access Dashboard</button>
            <p class="error-msg" id="errorMsg">Invalid password</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="dashboard-header">
            <h1>🌿 Pachis Customer Dashboard</h1>
            <div>
                <button class="btn-refresh" onclick="loadCustomers()">🔄 Refresh</button>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat-card">
                <div class="number" id="totalCustomers">0</div>
                <div class="label">Total Customers</div>
            </div>
            <div class="stat-card">
                <div class="number" id="usaCustomers">0</div>
                <div class="label">USA</div>
            </div>
            <div class="stat-card">
                <div class="number" id="mxCustomers">0</div>
                <div class="label">Mexico</div>
            </div>
        </div>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Search by name, email, or city..."
                oninput="filterTable()">
        </div>

        <div class="table-container">
            <table id="customersTable">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Name ↕</th>
                        <th onclick="sortTable(1)">Email ↕</th>
                        <th onclick="sortTable(2)">Phone ↕</th>
                        <th onclick="sortTable(3)">City ↕</th>
                        <th onclick="sortTable(4)">State ↕</th>
                        <th onclick="sortTable(5)">Country ↕</th>
                        <th onclick="sortTable(6)">Registered ↕</th>
                    </tr>
                </thead>
                <tbody id="customersBody">
                    <tr>
                        <td colspan="7" class="loading">Loading customers...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Admin password - you can change this
        const ADMIN_PASSWORD = '@Pachis2026';
        const API_BASE = 'https://us-central1-pachis-menu-app.cloudfunctions.net';

        let allCustomers = [];

        function login() {
            const password = document.getElementById('passwordInput').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                sessionStorage.setItem('pachisAdminAuth', 'true');
                loadCustomers();
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('pachisAdminAuth');
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('passwordInput').value = '';
        }

        async function loadCustomers() {
            const tbody = document.getElementById('customersBody');
            tbody.innerHTML = '<tr><td colspan="7" class="loading">Loading customers...</td></tr>';

            try {
                const response = await fetch(`${API_BASE}/getAllCustomers`);
                const data = await response.json();

                if (data.customers && data.customers.length > 0) {
                    allCustomers = data.customers;
                    renderTable(allCustomers);
                    updateStats(allCustomers);
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" class="loading">No customers found</td></tr>';
                }
            } catch (error) {
                console.error('Error loading customers:', error);
                tbody.innerHTML = '<tr><td colspan="7" class="loading">Error loading customers</td></tr>';
            }
        }

        function renderTable(customers) {
            const tbody = document.getElementById('customersBody');
            tbody.innerHTML = customers.map(c => `
                <tr>
                    <td>${c.firstName || ''} ${c.lastName || ''}</td>
                    <td>${c.email || ''}</td>
                    <td>${c.phone || ''}</td>
                    <td>${c.city || ''}</td>
                    <td>${c.state || ''}</td>
                    <td>${c.country || ''}</td>
                    <td>${c.createdAt ? new Date(c.createdAt).toLocaleDateString() : 'N/A'}</td>
                </tr>
            `).join('');
        }

        function updateStats(customers) {
            document.getElementById('totalCustomers').textContent = customers.length;

            const usaCount = customers.filter(c => {
                const country = (c.country || '').toLowerCase();
                return country.includes('united') || country === 'usa' || country === 'us';
            }).length;

            const mxCount = customers.filter(c => {
                const country = (c.country || '').toLowerCase();
                return country.includes('mex') || country === 'mx';
            }).length;

            document.getElementById('usaCustomers').textContent = usaCount;
            document.getElementById('mxCustomers').textContent = mxCount;
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allCustomers.filter(c => {
                const searchable = `${c.firstName} ${c.lastName} ${c.email} ${c.city} ${c.state} ${c.country}`.toLowerCase();
                return searchable.includes(query);
            });
            renderTable(filtered);
        }

        let sortDirection = 1;
        function sortTable(columnIndex) {
            const keys = ['firstName', 'email', 'phone', 'city', 'state', 'country', 'createdAt'];
            const key = keys[columnIndex];

            allCustomers.sort((a, b) => {
                const valA = (a[key] || '').toString().toLowerCase();
                const valB = (b[key] || '').toString().toLowerCase();
                return valA.localeCompare(valB) * sortDirection;
            });

            sortDirection *= -1;
            renderTable(allCustomers);
        }

        // Check if already logged in
        if (sessionStorage.getItem('pachisAdminAuth') === 'true') {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadCustomers();
        }
    </script>
</body>

</html>
